[project]
name = "jaldrishti-workspace"
version = "0.1.0"
description = "Evidence-driven flood intelligence and response-support platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jaldrishti-api",
  "jaldrishti-core[analysis]",
  "jaldrishti-workers",
]

[dependency-groups]
dev = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/jaldrishti",
  "workers",
]

[tool.uv.sources]
jaldrishti-api = { workspace = true }
jaldrishti-core = { workspace = true }
jaldrishti-workers = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = [
  "apps/api/src",
  "packages/jaldrishti/src",
  "workers/src",
]
markers = [
  "integration: requires local infrastructure such as PostGIS or Redis",
  "contract: validates a frozen external-source response",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["jaldrishti", "jaldrishti_api", "jaldrishti_workers"]

[tool.coverage.report]
show_missing = true
skip_covered = true
